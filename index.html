<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title">Well Delver</h1>
        <p class="game-tagline">Drill as deep as you can!</p>
        <select id="diff-selector" class="form-select w-50 mb-3">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span>
              <img id="score-img" src="img/water-can-cropped.png">
            </div>
            <div class="depth">Depth: <span id="depth">0</span></div>
            <button id="start-btn">Start Game</button>
        </div>
        
        <div id="game-container">
        </div>
        <footer class="footer">
          <a class="footer-link" href="https://www.charitywater.org/">Learn More about charity: water</a>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
